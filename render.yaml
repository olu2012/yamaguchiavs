services:
  - type: web
    name: avs-shipday-integration
    runtime: python
    region: oregon
    plan: starter  # Change to 'free' if you want free tier
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn flask_service_enhanced:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --worker-class gthread
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SHIPDAY_API_KEY
        sync: false
      - key: AVS_VENDOR_ID
        sync: false
      - key: AVS_SUBSCRIPTION_KEY
        sync: false
      - key: AVS_BASE_URL
        value: https://alat-dev-apim.azure-api.net/customops
      - key: YOUR_DOMAIN
        sync: false
      - key: FLASK_ENV
        value: production
    autoDeploy: true
    # branch: main  <- Comment this out or remove it
